services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go_backend
    restart: unless-stopped
    # Use env_file so it automatically uses your Supabase config from .env
    env_file:
      - .env
    environment:
      # Keep non-DB application settings here
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: ${APP_PORT:-8080}
      TZ: UTC
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - app_network
    command: ["./main"]

networks:
  app_network:
    driver: bridge